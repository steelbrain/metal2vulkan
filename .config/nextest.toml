# cargo-nextest configuration (https://nexte.st/docs/configuration/).
#
# A hung test must never block a gate run: nextest terminates any test still
# running after 20 minutes and reports it as a timeout. The slowest passing test in the
# 2026-09-30 gate runs took 334 s (debug, a loaded host), so the limit leaves more than 3x
# headroom. A test that reaches it is a hang or a regression to diagnose, not a limit to raise.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 20 }

# The ignored `soak_` tests enumerate whole structurizer families and run for up to an hour
# alone; outside the gate they get two hours.
[[profile.default.overrides]]
filter = 'test(/::soak_/)'
slow-timeout = { period = "300s", terminate-after = 24 }

# The exit lanes' timing checks each run alone. Each measures a child process's exit, from its
# last line to the end of its exit handlers, less the exiting thread's wait for a CPU, against
# 1.5 s: below the exit hook's own bound, so a hook that waited it out fails. That time holds the
# driver's device destruction, which the runtime does not set: on an RTX 3090 (NVIDIA 615.71.09)
# `vkDestroyDevice` took 54 ms alone (63 devices, at most 57 ms) and up to 2 s while other lane
# processes used the GPU (over 500 ms for 39 of 72 beside `runtime_lane::framebuffer_fetch`);
# exits that took 87 to 97 ms alone took 0.3 to 3.1 s beside other lanes there, and 1.8 to 2 s in
# an RTX 5080 Laptop GPU's whole suite.
[[profile.default.overrides]]
filter = 'package(metal2vulkan-validation) & test(/^runtime_lane::exits::(pending_work_stays_pending_at_exit|exits_from_the_runtime_s_threads_are_clean|an_exit_while_a_host_step_waits_is_clean|an_exit_mid_making_is_clean|an_exit_runs_no_handler_beside_a_cpu_device_s_work|an_exit_handler_registered_after_the_device_runs_its_work_to_completion|an_exit_handler_s_common_calls_answer_as_on_any_thread|an_exit_while_submitting_is_clean|exits_right_after_learning_of_completion_are_clean|an_exit_handler_registered_before_an_instance_runs_after_the_hook|exits_after_a_released_import_are_clean|an_instance_the_program_made_registers_the_exit_hook_after_its_layer_s_handler)$/)'
threads-required = 'num-test-threads'

# The lanes that fault the GPU on purpose (a GPU write into read-only host pages; they make GPU work
# on MoltenVK alone) compile on a GPU only under `--cfg m2v_gpu_hazards` (docs/VALIDATION.md), and
# run alone on macOS. Metal's recovery from a GPU fault fails command buffers of other processes
# the GPU runs then, as `MTLCommandBufferErrorInternal` ("Discarded (victim of GPU error/recovery)
# (00000005:kIOGPUCommandBufferCallbackErrorInnocentVictim)", the encoder
# `Affected`), and completes some with wrong results and no error: a plain Metal probe on the M3
# Max (macOS 27.0.1), the lane's texture round in one process beside processes that each fault
# once, failed 19 of 52,592 rounds beside 160 faults that way and completed 4 more with wrong
# bytes, and none of 12,270 rounds alone. `runtime_lane::host_copied_textures` failed with `Execution(1)` in 4 batches,
# each beside `a_gpu_fault_fails_its_command_buffer_and_the_queue_runs_on`; in 100 runs alone and
# 100 beside the other `host_*` lanes it never failed.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'package(metal2vulkan-validation) & test(/^runtime_lane::host_memory::(a_gpu_fault_fails_its_command_buffer_and_the_queue_runs_on|a_lost_device_s_command_buffers_let_go_of_their_pools_after_the_driver_s_completion)$/)'
threads-required = 'num-test-threads'

# The queue storm runs alone on macOS. Beside the runtime lane's other tests on the M3 Max (macOS
# 27.0.1, MoltenVK 1.4.1, load average 18 to 24) the runtime passed 1 storm of 4: its light bursts'
# 99th percentile was 1.6 to 5.6 busy command buffers above Metal's under MoltenVK's fences, against
# a margin of 1, and its median within 0.1. That tail is MoltenVK's completion path into the
# runtime's queue waiter: from a burst's submission to its completion as the runtime saw it, 25.9
# to 73.4 ms at the 99th percentile, where Metal's to its GPU end took 8.5 to 18.1 ms. The
# runtime's wake from there, 6.0 to 30.0 ms, was at or below Metal's 13.4 to 45.9 ms in every
# storm. Alone it still catches the runtime's own delays: it passed 5 storms of 5 on a quiet host,
# and failed 3 of 3 with 10 ms spun in each of the runtime's completion turns (a probe build), its
# bursts' median 3.53 busy command buffers against 2.03.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'package(metal2vulkan-validation) & test(/^runtime_lane::queue_storms::four_queues_storm_as_metal_s_do$/)'
threads-required = 'num-test-threads'

# The indirect-command census's shards each run alone. A case's command buffer that runs past
# Metal's bound fails as Metal's timeout (the old runtime's watchdog, 20.2 s of wall time with its
# queue not advancing), and the census fails it as hung. On lavapipe (LLVM 23.1.1, Mesa 26.2.4,
# LP_NUM_THREADS=1, a 24-CPU host), each shard alone, no case's dispatch or command waited 2.02 s,
# a tenth of the watchdog (one run of every shard); the eight cases of the division of every pair
# of half values, an eighth of the dividends each, waited 0.8 to 1.4 s each in either form, at
# most 0.12 s of it for a CPU. A shard alone keeps the other tests' work off its cases' CPUs.
[[profile.default.overrides]]
filter = 'package(metal2vulkan-validation) & test(/^runtime_lane::indirect_executions::every_case_of_buffers_alone_runs_from_a_command_as_its_dispatch_[0-9]+$/)'
threads-required = 'num-test-threads'

# The object-grid lane runs alone. Its cases are Metal's own grids, up to millions of object
# threadgroups each; those past 2^20 run on a GPU only under `--cfg m2v_gpu_hazards`, and a device
# without Apple's watchdog runs them to the end: an RTX 5080 Laptop GPU (NVIDIA 615.71.09) takes
# 2.4 to 2.7 microseconds over each, so 4,587,520 of them is
# 12.0 s with the GPU to itself. The test measures that cost and skips a case past half its wait,
# but the measurement comes from the smaller cases before it, and a GPU shared with other lane
# processes stretches the larger ones past the wait whatever the measurement said: that case took
# 12.0 s alone, over 60 s beside one other GPU test, and the test failed at
# `--test-threads 4` as well as at the default. Alone it passes in 50.7 s.
[[profile.default.overrides]]
filter = 'package(metal2vulkan-validation) & test(/^runtime_lane::mesh_draws::object_grids_run_as_metal_runs_them$/)'
threads-required = 'num-test-threads'

# The runtime's isolation tests of command queues sharing `VkQueue`s run alone. Each holds a
# compositor's 99th percentile of commit-to-completion latency under 5 ms, and its stalls over
# 10 ms to at most one, beside an application's 30 ms command buffers (and beside a queue waiting
# on the GPU for them): a bound of the GPU's time, which other test processes' work on the same GPU
# spends too. So does the held-head test, whose hold needs the long command buffer (about 30 ms of
# GPU time as it measures it first) to have more than the hold's budget left when the next commits
# come: other processes' work changes that time between its measure and its run. On the RTX 2080
# the gpu-wait and held-head tests failed only beside the parallel suite, and pass alone.
[[profile.default.overrides]]
filter = 'package(metal2vulkan-runtime) & test(/^tests::queue_share_device::(a_compositor_beside_a_long_queue_keeps_its_latency_once_that_queue_went_long|an_unshared_compositor_beside_a_long_queue_never_stalls|a_compositor_beside_a_queue_waiting_on_the_gpu_for_long_work_keeps_its_latency|an_unshared_head_behind_an_earlier_commit_of_the_held_queue_holds_nothing)$/)'
threads-required = 'num-test-threads'

# The runtime's GPU-start test of a command buffer's own long work runs alone. It holds the time
# from the command buffer's kernel end to its GPU start under half its life, a bound the GPU's
# queue sets: other test processes' work on the same GPU runs first. In an RTX 5080 Laptop GPU's
# whole runtime suite the start came 14.5 ms after the kernel end, of a 25.8 ms life, where the
# 64 dispatches' GPU span of 11.2 ms still held the work.
[[profile.default.overrides]]
filter = 'package(metal2vulkan-runtime) & test(/^tests::start_stamp::a_command_buffer_s_gpu_start_comes_before_its_own_long_work$/)'
threads-required = 'num-test-threads'

# The runtime's teardown test of the queue-switch check runs alone. It holds the teardown's wait
# for the check (its stop at the next step, its release of its Vulkan objects and of its shares)
# under the 16 ms the owner allows a wait. On an RTX 5080 Laptop GPU (NVIDIA 615.71.09) that wait
# took 1.12 to 1.23 ms in 3 runs with the GPU to itself (the objects' release 0.79 to 0.93 ms, the
# shares' 2 us), and 26.5 and 42.4 ms in runs where other test processes used the GPU.
[[profile.default.overrides]]
filter = 'package(metal2vulkan-runtime) & test(/^tests::teardown_threads::a_running_queue_switch_check_leaves_the_device_to_the_program_s_thread$/)'
threads-required = 'num-test-threads'

# The runtime's test of command buffers made `Scheduled` behind a waiting host step runs alone. It
# holds the long command buffer's commit call under the 16 ms the owner allows a wait in one of its
# runs at least, by the call's own clock. That call is recording on the program's thread alone (no
# pipeline wait, no wait for the scheduler's lock, no submission): on a Radeon 780M (RADV PHOENIX,
# Ryzen 7 7840HS) its later calls took 1.1 to 1.2 ms in the unoptimized test build with the GPU to
# itself, 0.10 to 0.26 ms in a release build. Beside the device suite's other processes (load
# average 14 on 16 threads) the same work took many times the CPU time and waited for a CPU too:
# 10.7 and 16.3 ms in the test build (8.2 and 10.4 ms of them on a CPU), and up to 38 ms in the
# rounds' runs; 5.8 and 7.0 ms in a release build (4.7 and 7.3 ms on a CPU).
[[profile.default.overrides]]
filter = 'package(metal2vulkan-runtime) & test(/^tests::held_step_order::command_buffers_behind_a_waiting_step_read_scheduled$/)'
threads-required = 'num-test-threads'

# The lane's index pool handler test runs alone. Each round holds a command buffer's completed
# handler to less than half a block's making after the command buffer completed: a handler that
# waited for the making ran as it ended. That bound is a thread's wake on the host's CPUs, which
# other test processes spend too: on the Radeon 780M (RADV, Mesa 26.2.6) beside 15 other lane
# processes and two other GPUs' runs (load average 18 on 16 threads) a round's handler ran 13.5 ms
# after its completion, 6.5 ms before a making of 23.5 ms ended; alone beside the two other GPUs'
# runs (load average 14), every one of 12 rounds' handlers ran within 0.6 ms.
[[profile.default.overrides]]
filter = 'package(metal2vulkan-validation) & test(/^runtime_lane::index_pools::a_completed_handler_waits_for_no_pool_block_made_meanwhile$/)'
threads-required = 'num-test-threads'

# The runtime's video interop tests run alone on Linux. Each makes a device with extra compute and
# video decode queues; on an RTX 3090 (NVIDIA 620.70.06) several such devices made at once by
# processes of these tests now and then met an error the kernel logged (Xid 69, 32 or 13),
# their devices lost, and another process's submission never completed (HOWTO.md, section 8).
[[profile.default.overrides]]
platform = 'cfg(target_os = "linux")'
filter = 'package(metal2vulkan-runtime) & test(/^tests::video_interop::/)'
threads-required = 'num-test-threads'

# The new runtime's device test of accesses up to 2 GiB runs alone. Its buffer is one Shared block
# of `MAX_BUFFER_LENGTH` (2 GiB), host memory where the Shared memory type is the host's (an RTX
# 2080, NVIDIA 620.70.06). Beside the runtime's compute encoder tests and three other translate
# tests there, the run's host memory peaked at 4.7 GiB; in a job holding 4 GiB it reached the 4 GiB
# and another test's Shared block failed with `ERROR_OUT_OF_DEVICE_MEMORY` (one run of two). The
# same tests without it peaked at 2.4 GiB, and it beside one other test at 2.8 GiB.
[[profile.default.overrides]]
filter = 'package(metal2vulkan-rt) & test(/::an_access_up_to_2_gib_lands_at_its_own_word$/)'
threads-required = 'num-test-threads'

# A GPU whose driver has few channels runs its device tests three at a time
# (`cargo nextest run --profile few-channels`). On NVIDIA's driver each `VkQueue` is a channel,
# and a device of the runtime's queue plan takes 18 (14 for the round robin, 2 presenting, the
# staging and fill queues). With no other process's devices, an RTX 2080 (NVIDIA 620.70.06) held
# 10 such devices at once and refused the 11th, and held 68 of the least plan's 3 `VkQueue`s;
# an RTX 3090 (620.70.06) and an RTX 5080 Laptop GPU (615.71.09) held 61 of the plan's
# (`crates/metal2vulkan-runtime/examples/queue_plan_cost.rs`). At the default parallelism a
# 16-thread host runs 16 test processes, which ask a 2080 for 288 `VkQueue`s at one device each;
# three ask it for 54, leaving room for other programs' devices on the same GPU.
[profile.few-channels]
test-threads = 3
