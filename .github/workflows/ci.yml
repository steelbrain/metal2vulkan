name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail the job on any rustc warning (unused imports, dead_code, etc.).
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin major OS images (not *-latest). Labels from actions/runner-images:
        #   ubuntu-26.04  — Ubuntu 26.04 LTS
        #   macos-26      — macOS 26 (arm64 GitHub-hosted runner)
        os: [ubuntu-26.04, macos-26]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # The dated nightly and components rust-toolchain.toml names.
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install LLVM + SPIR-V tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # llvm: llvm-dis; spirv-tools: spirv-val + the product passthrough path's spirv-as.
          # lavapipe is the CPU Vulkan ICD for the `m2v_cpu_icd` execution tests and the explicit
          # `corpus-vulkan --device-type cpu` qualification on GPU-less Linux runners.
          # vulkan-validationlayers: every engine candidate and L4 run enables
          # VK_LAYER_KHRONOS_validation and refuses to run without it.
          sudo apt-get install -y llvm spirv-tools mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
          command -v llvm-dis
          command -v spirv-val
          command -v spirv-as
          # Ubuntu's llvm is the oldest LLVM the committed `.ll` fixtures are written for:
          # here the validation test that each assembles with it must run, not skip.
          echo "METAL2VULKAN_TEST_REQUIRE_PINNED_LLVM=1" >> "$GITHUB_ENV"
          # Fail setup early if the CPU-ICD steps would have no ICD.
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/*.json /etc/vulkan/icd.d/*.json)
          echo "Vulkan ICDs: ${icds[*]:-none}"
          test "${#icds[@]}" -gt 0

      - name: Install LLVM + SPIR-V tools (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm spirv-tools
          # llvm is keg-only: not linked into /opt/homebrew/bin. GITHUB_PATH only
          # affects *later* steps, so export PATH here before command -v probes.
          export PATH="/opt/homebrew/opt/llvm/bin:/usr/local/opt/llvm/bin:${PATH}"
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          command -v llvm-dis
          command -v spirv-val
          command -v spirv-as

      - name: Format
        run: cargo fmt --all -- --check

      # clippy --all-targets --all-features typechecks the workspace INCLUDING the
      # `cli` and `serde` cfgs the shipped CLI is built with; without it, the binary and the code
      # and tests behind `#[cfg(feature = "serde")]` are never compiled by any gate.
      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The product with no feature and with each feature alone, as a consumer of the published crate
      # may build it. `--all-features` compiles every gated item, but an import or item that only
      # another feature (or only a test) uses is unused, or missing, without it; `--workspace`
      # cannot check that either, since the validation member enables most features for every
      # build. Feature gates combine with platform cfgs, so both hosts run it. The runtime crate
      # (`metal2vulkan-runtime`) has no feature and reaches the translator only
      # through its public API: it is checked the same way.
      - name: Clippy under each feature alone (warnings denied)
        run: |
          set -euo pipefail
          for features in "" serde ash cli; do
            echo "::group::features=${features:-none}"
            cargo clippy -p metal2vulkan --all-targets --no-default-features --features "$features" -- -D warnings
            echo "::endgroup::"
          done
          echo "::group::metal2vulkan-runtime"
          cargo clippy -p metal2vulkan-runtime --all-targets -- -D warnings
          echo "::endgroup::"
          # The AIR front end's crate as a consumer of `metal2vulkan-air` builds it
          # alone, with no feature and with `serde`, so nothing the translator or
          # validation enables in a workspace build hides an unused import or a missing item.
          for features in "" serde; do
            echo "::group::metal2vulkan-air features=${features:-none}"
            cargo clippy -p metal2vulkan-air --all-targets --no-default-features --features "$features" -- -D warnings
            echo "::endgroup::"
          done

      # Validation's device tests, and the helpers only they call, compile only under `--cfg m2v_gpu`
      # or `--cfg m2v_cpu_icd` (docs/VALIDATION.md). Clippy under `m2v_gpu` checks that code on each
      # host without opening a device: on macOS with the Metal tests, and on Linux without them,
      # where a helper compiled without its callers is dead code. Its own target directory keeps the
      # ordinary build's warm.
      - name: Clippy under --cfg m2v_gpu (warnings denied)
        env:
          RUSTFLAGS: -Dwarnings --cfg m2v_gpu
          CARGO_TARGET_DIR: target/gpucfg
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build public documentation (warnings denied)
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --all-features --no-deps

      # The consumer reference of the new API's frozen surface: the library's
      # rustdoc build, warnings denied, and no link to a hidden item.
      - name: Build the new API's consumer reference (warnings denied)
        run: scripts/api-docs

      # A doc comment on a private item, and a link to a private path, are rendered only when
      # rustdoc documents private items, which the documentation steps above never do: each
      # renders the public surface alone. Their intra-doc links are therefore checked nowhere else
      # here, and a broken one has only ever surfaced when someone passed
      # `--document-private-items` by hand. This
      # step runs that pass over each crate and holds the crate to the number of diagnostics it
      # still carries, so a newly broken private link is red here instead. Each number is a
      # backlog to drive to zero, never a budget: a commit that fixes some lowers its crate's
      # number in the same commit, and a crate that reaches 0 stays at 0.
      - name: Private intra-doc links (no new breakage)
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/private-doc-links.log"
          status=0
          for row in \
            metal2vulkan=0 \
            metal2vulkan-air=0 \
            metal2vulkan-runtime=0 \
            metal2vulkan-validation=0 \
            metal2vulkan-conformance=0 \
            metal2vulkan-devtools=0
          do
            crate=${row%=*}
            ceiling=${row#*=}
            cargo doc -p "$crate" --all-features --no-deps --document-private-items \
              > "$log" 2>&1 || true
            # Under `-Dwarnings` each diagnostic is an `error: ` line, and the last one is
            # rustdoc's own "could not document <crate>" summary rather than a diagnostic.
            lines=$(grep -c '^error: ' "$log" || true)
            summary=$(grep -c '^error: could not document' "$log" || true)
            n=$((lines - summary))
            echo "$crate: $n (ceiling $ceiling)"
            if [ "$n" -gt "$ceiling" ]; then
              cat "$log"
              echo "::error::$crate reports $n private intra-doc link diagnostics, over its ceiling of $ceiling"
              status=1
            elif [ "$n" -lt "$ceiling" ]; then
              echo "::notice::$crate reports $n, under its ceiling of $ceiling: lower it in this file"
            fi
          done
          rm -f "$log"
          exit "$status"

      # The published crates as crates.io takes them: each packages, and its package
      # builds alone against the others' packages, so none reads a file outside its own directory.
      # Validation and the dev-tools crate are not published.
      - name: Package the published crates
        run: cargo package --workspace --exclude metal2vulkan-validation --exclude metal2vulkan-conformance --exclude metal2vulkan-devtools

      # With the AIR front end's crate's own tests, and the dev-tools crate's:
      # its tool runner and L3 checks.
      - name: Test metal2vulkan
        run: cargo nextest run -p metal2vulkan -p metal2vulkan-air -p metal2vulkan-runtime -p metal2vulkan-devtools --all-features

      # GPU-free on every host: tests that open a device compile only under `--cfg m2v_gpu` or
      # `--cfg m2v_cpu_icd`, and no device-opening code runs without one of them.
      - name: Test validation suite
        run: cargo nextest run -p metal2vulkan-validation --all-features

      # The conformance suite's own machinery, with no device: a stub side stands in for a GPU, so
      # the transcript, the comparison, the justification rule, the verdicts, the recordings'
      # staleness and the report are all checked on every host.
      - name: Test the conformance suite
        run: cargo nextest run -p metal2vulkan-conformance --all-features

      # nextest does not run doctests.
      - name: Doc tests
        run: cargo test --workspace --all-features --doc

      # Device-executing validation tests on lavapipe. `DeviceType::Cpu` matches only a CPU
      # physical device, so this never reaches a GPU even on a runner that has one. macOS CI runs
      # no device tests.
      - name: Test validation suite on the CPU Vulkan ICD (Linux)
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -Dwarnings --cfg m2v_cpu_icd
          LP_NUM_THREADS: "1"
        run: cargo nextest run -p metal2vulkan-validation --all-features

      # The conformance suite's replay leg on lavapipe: it reads the committed recordings, runs the
      # runtime side and compares, with no Metal present. Its exit status is 0 only where the run
      # holds no surprise: no unrecorded case, no stale recording, and exactly the gaps
      # crates/metal2vulkan-conformance/known-gaps.tsv expects on this venue. A refusal or a
      # divergence that ledger does not list fails here, and so does a row it lists that the run no
      # longer holds, so closing a gap forces the ledger edit. A venue that lacks a feature a case
      # needs does not spoil it.
      - name: Replay the conformance suite on the CPU Vulkan ICD (Linux)
        if: runner.os == 'Linux'
        env:
          LP_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          cargo build -p metal2vulkan-conformance --bin conformance
          target/debug/conformance replay --cpu

      # Machine-specific semantic qualification remains explicit. Linux CI has lavapipe, so it can
      # execute the owned public cases with the engine, in both robustness legs, against their
      # exact committed Metal observations without a physical GPU. Rows written here are ephemeral
      # CI evidence, not committed environment slots (see the script's header).
      - name: Qualify public cases on native Vulkan (Linux)
        if: runner.os == 'Linux'
        env:
          LP_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          cargo build -p metal2vulkan-validation --bins
          bash scripts/qualify-public-cases target/debug
